<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Glance — direct et widgets</title>
<link rel="stylesheet" href="commun.css">
<style>
  .live .ligne { display: flex; align-items: center; gap: calc(26 * var(--u)); padding: calc(26 * var(--u)) 0; }
  .live .ligne + .ligne { border-top: calc(2 * var(--u)) solid var(--line); }
  .live .nom { flex: 1; font-weight: 600; font-size: calc(42 * var(--u)); }
  .live .n { font-family: "Fredoka"; font-weight: 600; font-size: calc(76 * var(--u)); line-height: 1; letter-spacing: -.02em; }
  .live .n small { font-family: "Geist"; font-weight: 400; font-size: calc(30 * var(--u)); color: var(--fg2); margin-left: calc(12 * var(--u)); letter-spacing: 0; }
  .live .zero .n { color: var(--fg3); }
  .live .zero .point-live { background: var(--fg3); }
  .live .zero .point-live::after { display: none; }
  .live .ligne.l-sp { padding-top: calc(20 * var(--u)); }

  .panneau { flex: 1 1 auto; background: #16140F; border-radius: calc(64 * var(--u)); padding: calc(44 * var(--u)); display: flex; flex-direction: column; gap: calc(26 * var(--u)); position: relative; overflow: hidden; min-height: 0; flex-shrink: 0; flex-grow: 0; }
  .panneau .os { display: flex; gap: calc(14 * var(--u)); }
  .panneau .os span { font-family: "JetBrains Mono"; font-weight: 600; font-size: calc(26 * var(--u)); letter-spacing: .14em; text-transform: uppercase; color: #F3F0E9; border: calc(3 * var(--u)) solid rgba(250, 245, 235, .25); padding: calc(10 * var(--u)) calc(24 * var(--u)); border-radius: 999px; }
  .panneau .os span.ios { background: #F3F0E9; color: #16140F; border-color: #F3F0E9; }
  .panneau .courbe-fond { position: absolute; right: calc(-120 * var(--u)); bottom: calc(-60 * var(--u)); width: calc(900 * var(--u)); opacity: .08; }

  .widget { background: #F7F5F1; color: #211E19; border-radius: calc(54 * var(--u)); padding: calc(36 * var(--u)) calc(40 * var(--u)); position: relative; z-index: 1; }
  .widget .tete { display: flex; justify-content: space-between; align-items: flex-start; }
  .widget .titre-w { font-weight: 600; font-size: calc(38 * var(--u)); }
  .widget .periode { font-family: "JetBrains Mono"; font-size: calc(26 * var(--u)); color: #8C857A; margin-top: calc(4 * var(--u)); }
  .widget .gros { font-family: "Fredoka"; font-weight: 600; font-size: calc(86 * var(--u)); line-height: 1; letter-spacing: -.02em; text-align: right; }
  .widget .d { font-family: "JetBrains Mono"; font-weight: 600; font-size: calc(28 * var(--u)); color: #3B7A5A; text-align: right; margin-top: calc(6 * var(--u)); }
  .widget .d.neg { color: #B15A42; }
  .widget .courbe { height: calc(110 * var(--u)); position: relative; margin-top: calc(10 * var(--u)); }
  .widget .courbe svg { position: absolute; inset: 0; }
  .widget .site { display: flex; align-items: center; gap: calc(20 * var(--u)); border-top: calc(2 * var(--u)) solid rgba(30, 25, 15, .09); padding-top: calc(14 * var(--u)); margin-top: calc(10 * var(--u)); }
  .widget .site .s { flex: 1; font-weight: 500; font-size: calc(33 * var(--u)); }
  .widget .site .mini { width: calc(140 * var(--u)); height: calc(46 * var(--u)); position: relative; }
  .widget .site .mini svg { position: absolute; inset: 0; }
  .widget .site b { font-family: "Fredoka"; font-weight: 600; font-size: calc(40 * var(--u)); }
  .widget .site .d { margin: 0; min-width: calc(110 * var(--u)); }
  .bas { display: grid; grid-template-columns: 1fr 1fr; gap: calc(26 * var(--u)); position: relative; z-index: 1; }
  .bas .widget .pages { border-top: calc(2 * var(--u)) solid rgba(30, 25, 15, .09); margin-top: calc(12 * var(--u)); padding-top: calc(12 * var(--u)); font-size: calc(30 * var(--u)); color: #8C857A; }
  .bas .widget .pages b { font-family: "Fredoka"; font-weight: 600; font-size: calc(40 * var(--u)); color: #211E19; margin-right: calc(8 * var(--u)); }
  .icones { display: grid; grid-template-columns: 1fr 1fr; gap: calc(26 * var(--u)); align-content: center; padding: 0 calc(30 * var(--u)); }
  .icones i { display: block; aspect-ratio: 1; border-radius: 24%; background: rgba(250, 245, 235, .12); }
  .icones i:nth-child(2) { background: rgba(250, 245, 235, .2); }
  .icones img { width: 100%; border-radius: 24%; display: block; box-shadow: 0 0 0 calc(7 * var(--u)) rgba(90, 165, 126, .45); }
  .bas .widget .titre-w { font-size: calc(34 * var(--u)); white-space: nowrap; }
  .bas .widget .gros { font-size: calc(64 * var(--u)) !important; }
  .dock { margin-top: auto; display: flex; justify-content: center; gap: calc(30 * var(--u)); padding: calc(26 * var(--u)); border-radius: calc(60 * var(--u)); background: rgba(250, 245, 235, .1); position: relative; z-index: 1; }
  .dock i { width: calc(110 * var(--u)); aspect-ratio: 1; border-radius: 24%; background: rgba(250, 245, 235, .2); display: block; }
  .f-play .dock { display: none; }
  .f-ipad .scene { display: grid; grid-template-columns: 1fr 1.1fr; }
  #lignes { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
  .live { flex: 1 1 auto; }
  .f-play .extra { display: none; }
  .f-play .widget .courbe { height: calc(80 * var(--u)); }
  .f-play .panneau { gap: calc(20 * var(--u)); padding: calc(38 * var(--u)); }
  .f-ipad .bas .widget .titre-w { font-size: calc(28 * var(--u)); }
  .f-ipad .bas .widget .gros { font-size: calc(52 * var(--u)) !important; }
  .f-ipad .widget .site .mini { width: calc(90 * var(--u)); }
  .f-ipad .widget .site .s { white-space: nowrap; font-size: calc(30 * var(--u)); }
</style>
</head>
<body class="fond-foret clair">
  <header class="entete">
    <div class="marque"></div>
    <h1 class="titre" data-t="titre"></h1>
    <p class="appui" data-t="appui"></p>
  </header>
  <main class="scene">
    <section class="carte live">
      <span class="label" data-t="etiquette"></span>
      <div id="lignes" style="margin-top: calc(10 * var(--u))"></div>
    </section>
    <section class="panneau">
      <div class="os"><span class="ios" data-t="ios"></span><span data-t="android"></span></div>
      <div class="widget">
        <div class="tete"><div><div class="titre-w" data-t="w_titre"></div><div class="periode" data-t="w_periode"></div></div>
          <div><div class="gros" id="g1"></div><div class="d" id="d1"></div></div></div>
        <div class="courbe" id="c1"></div>
        <div class="site"><span class="s">atelier-lune.fr</span><span class="mini" id="m1"></span><b>1 240</b><span class="d" id="dm1"></span></div>
        <div class="site"><span class="s">carnet.app</span><span class="mini" id="m2"></span><b>402</b><span class="d" id="dm2"></span></div>
      </div>
      <div class="bas">
        <div class="widget">
          <div class="tete"><div><div class="titre-w">carnet.app</div><div class="periode" data-t="w_periode"></div></div>
            <div><div class="gros" style="font-size: calc(76 * var(--u))">402</div><div class="d" id="d2"></div></div></div>
          <div class="courbe" id="c2" style="height: calc(90 * var(--u))"></div>
          <div class="pages"><b>1 180</b><span data-t="w_pages"></span></div>
        </div>
        <div class="icones"><i></i><i></i><i></i><img src="/store/icon_master.svg" alt=""></div>
      </div>
      <div class="dock"><i></i><i></i><i></i><i></i></div>
    </section>
  </main>
<script src="commun.js"></script>
<script>
monter("v7", async () => {
  const sites = [["atelier-lune.fr", 12], ["carnet.app", 5], ["studio-nord.com", 2], ["petit-atlas.fr", 1, true], ["bruit-blanc.fr", 0, true]];
  document.getElementById("lignes").innerHTML = sites.map(([nom, n, extra]) =>
    `<div class="ligne${n ? "" : " zero"}${extra ? " extra" : ""}"><i class="point-live"></i><span class="nom">${nom}</span><span class="n">${n}<small>${T("en_ligne")}</small></span></div>`).join("");
  document.getElementById("g1").textContent = nb(2104);
  document.getElementById("d1").textContent = signe(14);
  document.getElementById("d2").textContent = signe(18);
  document.getElementById("dm1").textContent = signe(-9);
  document.getElementById("dm1").classList.add("neg");
  document.getElementById("dm2").textContent = signe(18);
  document.getElementById("dm2").previousElementSibling.style.cssText = "";
  spark(document.getElementById("c1"), serie(14, { base: 100, amp: 25, f: 1, pente: 10, bruit: 4, graine: 71 }), "#3B7A5A", { epaisseur: 6 });
  spark(document.getElementById("c2"), serie(14, { base: 60, amp: 20, f: 1.2, phase: .2, pente: 12, bruit: 3, graine: 72 }), "#3B7A5A", { epaisseur: 6 });
  spark(document.getElementById("m1"), serie(10, { base: 50, amp: 12, f: 1, pente: -14, bruit: 3, graine: 73 }), "#3B7A5A", { epaisseur: 5 });
  spark(document.getElementById("m2"), serie(10, { base: 40, amp: 10, f: 1.3, pente: 16, bruit: 3, graine: 74 }), "#3B7A5A", { epaisseur: 5 });
});
</script>
</body>
</html>
